# ============================================================
# 04-frontend.yaml — Nginx + Vite зібраний фронтенд
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: runmap-frontend
  labels:
    app: frontend
spec:
  replicas: 2       # ← 2 репліки для балансування навантаження
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: runmap-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort        # Відкриваємо назовні через Minikube IP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080     # Доступно на http://<minikube ip>:30080
