version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: runmap_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  osrm:
    image: osrm/osrm-backend
    container_name: runmap_osrm
    volumes:
      - ./map_data:/data
    command: >
      sh -c "
      if [ ! -f /data/kyiv_small.osrm ]; then
        echo '=== Processing OSM data (this may take a few minutes) ===' &&
        osrm-extract -p /opt/foot.lua /data/kyiv_small.osm.pbf &&
        osrm-partition /data/kyiv_small.osrm &&
        osrm-customize /data/kyiv_small.osrm &&
        echo '=== Processing finished ==='
      fi &&
      osrm-routed --algorithm mld /data/kyiv_small.osrm
      "
    ports:
      - "5000:5000"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: runmap_backend
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OSRM_BASE_URL=${OSRM_BASE_URL}
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: runmap_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data: